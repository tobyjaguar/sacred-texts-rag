[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sacred-texts-rag"
version = "0.1.0"
description = "Convert a sacred-texts.com HTML mirror into a RAG-ready text + vector corpus."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "tobyjaguar" }]
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
embed = [
    # Pick one at implementation time; left commented as a menu.
    # "sentence-transformers>=3.0",
    # "openai>=1.0",
    # "anthropic>=0.40",
]
index = [
    # Pick one at implementation time.
    # "faiss-cpu>=1.8",
    # "chromadb>=0.5",
    # "lancedb>=0.13",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
